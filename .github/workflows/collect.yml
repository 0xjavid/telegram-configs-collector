name: Collect Configurations

on:
  workflow_call:

permissions:
  contents: write

# Serialize scheduled, push-triggered and manual publishing for the same branch.
concurrency:
  group: collect-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt

      - name: Validate code before collection
        run: |
          python -m pip check
          python -m ruff check .
          python -m pytest

      - name: Collect configurations
        env:
          SUBSCRIPTION_BRANCH: ${{ github.ref_name }}
        run: python main.py

      - name: Commit and publish generated files
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never stage source changes, caches or the downloaded GeoIP database.
          git add -- channels countries layers networks protocols security splitted subscribe \
            "telegram channels.json" "invalid telegram channels.json" \
            "subscription links.json" "last update" readme.md
          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi
          git commit -m "Update configs $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M %Z')"
          # A normal push preserves history and fails safely on concurrent edits.
          git push origin "HEAD:${TARGET_BRANCH}"
