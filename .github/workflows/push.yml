name: Execute On Push

on:
  push:
    branches: [main]
    # Generated feed commits do not need to start another collection run.
    paths:
      - '*.py'
      - 'requirements*'
      - 'pyproject.toml'
      - 'tests/**'
      - 'docs/readme-template.md'
      - 'telegram channels.json'
      - 'subscription links.json'
      - '.github/workflows/collect.yml'
      - '.github/workflows/push.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    uses: ./.github/workflows/collect.yml
