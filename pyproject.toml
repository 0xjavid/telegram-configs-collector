[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Keep legacy formatting, but fail on syntax/name errors, unused code, and
# implicit string concatenation (which previously broke the reset paths).
select = ["F", "E9", "ISC001", "ISC002"]
